[project]
name = "LifeVector"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Abdul Hadi", email = "developwithhadi@gmail.com" },
    { name = "Muneeb Nawaz", email = "muneebnawaz@tutamail.com" },
]
dependencies = [
    "flet>=1.0.5",
    "fractional-indexing>=0.1.3",
]

[dependency-groups]
dev = [
    "flet-cli>=1.0.5",
    "flet-desktop>=1.0.5",
    "flet-web>=1.0.5",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]>=1.0.5",
    "pyrefly>=1.4.1",
    "ruff>=0.17.4",
    "uv>=0.13.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.flet]
desktop_flavor = "light"    # Change to "full" to use flet-audio and flet-video
org = "io.github.lifevector.LifeVector"
product = "LifeVector"
company = "LifeVector"
copyright = "Copyright (C) 2026 by LifeVector"

# src/assets/icon.png is the icon for every platform. Keep it transparent and
# filling the whole canvas: web, Windows and Linux show it as-is, and Flet
# shrinks it to the margin iOS, macOS and Android each mask away. This colour
# is what sits behind it where transparency cannot survive - the iOS icon, the
# macOS tile and the Android background layer. Defaults to white.
# icon_background = "#ffffff"

[tool.flet.app]
path = "src"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lifevector"]
